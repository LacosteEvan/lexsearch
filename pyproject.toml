[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexsearch"
version = "0.1.0"
description = "Finding the law: a search agent over 22,633 Belgian statutes, with a fine-tuned retriever, each stage measured."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "datasets>=3.0",
  "sentence-transformers[train]>=3.0",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
lexsearch = "lexsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
